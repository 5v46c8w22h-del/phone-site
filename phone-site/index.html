<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机编码查询</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    #search { width: 100%; padding: 12px; font-size: 18px; box-sizing: border-box; }
    #result { margin-top: 24px; }
    .gallery img { width: 200px; margin: 6px; border-radius: 6px; cursor: pointer; }
    .video-link { display: inline-block; margin-top: 12px; padding: 10px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; }
    #lightbox img { max-width: 90%; max-height: 90%; }
  </style>
</head>
<body>
  <h1>手机编码查询</h1>
  <input id="search" placeholder="输入编码，如 A001" autocomplete="off">
  <div id="result"></div>

  <div id="lightbox"><img src="" alt=""></div>

  <script src="app.js"></script>
</body>
</html>
